<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>orchestra · concept map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="find">
    <input id="q" type="search" placeholder="Find a concept or function" autocomplete="off" aria-label="Search">
    <ul id="hits" hidden></ul>
  </div>
</header>
<main>
  <section id="stage" data-mode="diagram">
    <svg id="diagram" role="img"></svg>
    <div id="sketch"></div>
    <div id="legend" hidden></div>
    <div id="toggle" hidden></div>
    <div id="zoom"><button id="zin" title="Zoom in (+)">+</button><button id="zout" title="Zoom out (-)">−</button><button id="zfit" title="Fit (0)">fit</button></div>
  </section>
  <aside id="drawer"></aside>
</main>
<script src="vendor/elk.bundled.js"></script>
<script src="app.js"></script>
<script src="orchestra-concepts.js"></script>
</body>
</html>
