name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uvx --from playwright playwright install chromium-headless-shell
      - run: uv run pytest

  cbi-check:
    name: Architecture & integrity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CBI Check and Review
        uses: ./.github/actions/cbi-check
        with:
          base-ref: ${{ github.base_ref || 'main' }}
          fail-on-problems: "true"
          fail-on-cycles: 'true'
          forbid: 'codebase-inspector:codebase-inspector-app'
          review: "true"
          python-version: "3.13"

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - run: ls -la dist/*.whl dist/*.tar.gz
      - run: uv tool install dist/*.whl --force
      - run: cbi --version
      - run: |
          uv venv /tmp/test-sdist-venv
          uv pip install --python /tmp/test-sdist-venv dist/*.tar.gz
          /tmp/test-sdist-venv/bin/cbi --version
      - run: |
          mkdir -p /tmp/test-sdist-cbi
          git -C /tmp/test-sdist-cbi init
          (cd /tmp/test-sdist-cbi && /tmp/test-sdist-venv/bin/cbi init)
          (cd /tmp/test-sdist-cbi && /tmp/test-sdist-venv/bin/cbi scan)
          (cd /tmp/test-sdist-cbi && /tmp/test-sdist-venv/bin/cbi status --out /tmp/test-sdist-cbi/.cbi)
          rm -rf /tmp/test-sdist-venv /tmp/test-sdist-cbi

  app:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
