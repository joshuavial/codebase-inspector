name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Desktop (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: desktop-macos
            args: --mac dmg zip --arm64
            files: |
              app/release/*.dmg
              app/release/*.zip
          - os: windows-latest
            artifact: desktop-windows
            args: --win nsis zip
            files: |
              app/release/*.exe
              app/release/*.zip
          - os: ubuntu-latest
            artifact: desktop-linux
            args: --linux AppImage deb
            files: |
              app/release/*.AppImage
              app/release/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uvx --from playwright playwright install chromium-headless-shell
      - run: uv run pytest
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: App smoke (hidden windows)
        if: runner.os == 'macOS'
        working-directory: app
        run: node test/smoke.mjs && node test/editor-ref.mjs
      - name: Package (unsigned)
        working-directory: app
        run: npx --no-install electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [app, python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Changelog section
        run: python3 .github/changelog_notes.py "$GITHUB_REF_NAME" CHANGELOG.md > notes.md
      - name: Create or update the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.whl' -o -name '*.tar.gz' \) \
            ! -name '*.blockmap')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release files" >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --draft --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" "${files[@]}" --draft --title "$tag" --notes-file notes.md
          fi
