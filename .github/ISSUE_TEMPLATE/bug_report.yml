name: Bug report
description: Report a problem with Codebase Inspector
body:
  - type: markdown
    attributes:
      value: "This is a public issue. Review the draft and remove any private information before submitting."
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Do not include private repository details, source code or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small public example where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      render: text
